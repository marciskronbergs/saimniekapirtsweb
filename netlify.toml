# Netlify build settings for continuous deployment from Git.
#
# Until now the site was deployed manually, and the publish directory was
# configured in the Netlify UI as an absolute Windows path, which does not
# exist on Netlify's build machines. Committing the settings here makes the
# build reproducible and overrides the UI values once the repository is
# linked.
#
# Redirects are intentionally not declared here: public/_redirects already
# holds the full redirect list plus the SPA fallback, and rules in this file
# would take precedence over that file.

[build]
  # The verification step fails the build when the Supabase variables were
  # absent, so a bundle that cannot reach the database is never published.
  command = "npm run build && npm run prerender && npm run verify:build"
  publish = "dist"

[build.environment]
  # Matches the Node version the committed dist/ was verified to reproduce on.
  NODE_VERSION = "22"
  # VITE_-prefixed variables are compiled into the client bundle by design, so
  # Netlify's secrets scanner would otherwise find their values in dist/ and
  # fail the build.
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY"
