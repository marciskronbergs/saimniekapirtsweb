# Read by the Supabase GitHub integration. Edge Functions are deployed to a
# branch -- and, on merge to main, to production -- only when declared here.
project_id = "wigoyeorqnssgbrgexku"

# Called by the database (pg_net, with the invoice hook secret), by Stripe and
# by links in emails, none of which carries a Supabase JWT. The function checks
# its own secrets, so the gateway must not require one -- as in production.
[functions.invoice]
verify_jwt = false

# Called by pg_cron (no JWT) and fetched by Google Ads' scheduled upload. It
# takes no input and checks its own key for the feed and status pages.
[functions.conversions]
verify_jwt = false

# Checks the Meta Conversions API token; keyed with the conversions feed key.
[functions.conversions-check]
verify_jwt = false
